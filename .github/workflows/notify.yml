# Emails people that something happened.
#
# Hourly like the others, and away from them: grading runs at :17 and the
# house account at :37, so this sits at :47 and picks up whatever those
# two produced.
name: Notification emails

on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send digests
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not set in this repository's secrets."
            exit 1
          fi

          code=$(curl -sS -o response.json -w '%{http_code}' --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://gwuap.co/api/notify)

          echo "HTTP $code"
          cat response.json
          echo

          # 503 means a key is missing, which is a setup step rather than
          # a failure — say so instead of going red every hour.
          if [ "$code" = "503" ]; then
            echo "::warning::$(tr -d '\n' < response.json)"
            exit 0
          fi
          if [ "$code" != "200" ]; then
            echo "::error::Notification emails failed with HTTP $code — $(tr -d '\n' < response.json)"
            exit 1
          fi
          echo "::notice::$(tr -d '\n' < response.json)"
