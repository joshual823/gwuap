<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:{{W}}px; height:{{H}}px; overflow:hidden; background:#0d2c14; }
  .stage { position:relative; width:{{W}}px; height:{{H}}px; overflow:hidden;
    font-family:Inter,'Helvetica Neue',Arial,sans-serif; }

  .photo { position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; object-position:{{POS}}; }

  /* Scrim. The photo is bright and busy at the top and the grass mid-frame
     is the same value as white text, so the type needs ground under it —
     heaviest where the wordmark and headline sit, light over the ball so
     the thing you're looking at stays the thing you're looking at. */
  .scrim { position:absolute; inset:0;
    background:
      linear-gradient(180deg,
        rgba(4,26,10,.52) 0%, rgba(4,26,10,.44) 26%,
        rgba(4,26,10,.26) 50%, rgba(4,26,10,.10) 66%,
        rgba(4,26,10,.34) 86%, rgba(4,26,10,.72) 100%),
      radial-gradient(105% 70% at 50% 30%, rgba(0,0,0,.28) 0%, transparent 70%); }

  .brand { position:absolute; top:calc(64px * {{SCALE}}); left:0; right:0; display:flex;
    align-items:center; justify-content:center; gap:calc(16px * {{SCALE}}); }
  .brand img { width:calc(58px * {{SCALE}}); height:calc(58px * {{SCALE}});
    filter:drop-shadow(0 3px 12px rgba(0,0,0,.6)); }
  .brand span { font-size:calc(53px * {{SCALE}}); font-weight:800; letter-spacing:-.028em;
    color:#fff; text-shadow:0 3px 18px rgba(0,0,0,.7); }

  .wrap { position:absolute; left:0; right:0; top:{{TOP}}; display:flex;
    flex-direction:column; align-items:center; }

  .chalk { text-align:center; font-weight:900; letter-spacing:-.04em; line-height:.89;
    font-size:calc(142px * {{SCALE}}); text-transform:uppercase; color:#fff;
    text-shadow:0 4px 26px rgba(0,0,0,.72), 0 1px 3px rgba(0,0,0,.5); }
  .chalk em { font-style:normal; display:block; }

  .sub { margin-top:calc(34px * {{SCALE}}); text-align:center; color:#fff;
    font-size:calc(42px * {{SCALE}}); font-weight:700;
    text-shadow:0 3px 20px rgba(0,0,0,.8); }
  .sub b { color:#7CFF8C; font-weight:800; }

  .foot { position:absolute; left:0; right:0; bottom:calc(44px * {{SCALE}}); text-align:center;
    color:rgba(255,255,255,.92); font-size:calc(22px * {{SCALE}}); font-weight:500;
    line-height:1.45; text-shadow:0 2px 10px rgba(0,0,0,.9); padding:0 70px; }
</style>

<div class="stage">
  <img class="photo" src="{{PHOTO}}" alt="">
  <div class="scrim"></div>
  <div class="brand"><img src="logo.svg" alt=""><span>Gwuap</span></div>
  <div class="wrap">
    <div class="chalk">{{HEAD}}</div>
    <div class="sub">{{SUB}}</div>
  </div>
  <div class="foot">
    Not a sportsbook. No betting, no money — nothing at stake but your record.
  </div>
</div>
