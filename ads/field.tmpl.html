<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:{{W}}px; height:{{H}}px; overflow:hidden; background:#0d4a1e; }
  .stage { position:relative; width:{{W}}px; height:{{H}}px; overflow:hidden;
    font-family:Inter,'Helvetica Neue',Arial,sans-serif; }

  /* The turf is drawn, not photographed. A stock football photo we don't
     own is a copyright problem in a paid ad, and a field is mostly
     stripes and straight lines anyway. */
  .field { position:absolute; inset:-30%; transform:rotate(-6deg) scale(1.1); }

  /* Mown stripes run across the field... */
  .field .grass { position:absolute; inset:0; background-color:#1c7d33;
    background-image:repeating-linear-gradient(0deg,
      rgba(255,255,255,.055) 0 118px, rgba(0,0,0,.055) 118px 236px); }

  /* ...and the yard lines run the other way, which is the thing the
     first attempt got wrong: both sets parallel reads as a barcode. */
  .field .yards { position:absolute; inset:0;
    background-image:repeating-linear-gradient(90deg,
      rgba(255,255,255,.72) 0 7px, transparent 7px 196px); }

  /* Two rows of hash marks, the detail that makes it read as football
     rather than as a tennis court. */
  .field .hash { position:absolute; left:0; right:0; height:5px;
    background-image:repeating-linear-gradient(90deg,
      rgba(255,255,255,.6) 0 5px, transparent 5px 39px); }
  .field .hash.a { top:36%; } .field .hash.b { top:64%; }

  .grain { position:absolute; inset:0; opacity:.17; mix-blend-mode:overlay; }
  .vig { position:absolute; inset:0;
    background:
      radial-gradient(115% 85% at 50% 42%, transparent 26%, rgba(0,0,0,.5) 100%),
      linear-gradient(180deg, rgba(0,0,0,.3) 0%, transparent 22%, transparent 74%, rgba(0,0,0,.42) 100%); }

  .brand { position:absolute; top:calc(76px * {{SCALE}}); left:0; right:0; display:flex;
    align-items:center; justify-content:center; gap:17px; }
  .brand img { width:calc(60px * {{SCALE}}); height:calc(60px * {{SCALE}}); filter:drop-shadow(0 3px 10px rgba(0,0,0,.5)); }
  .brand span { font-size:calc(55px * {{SCALE}}); font-weight:800; letter-spacing:-.028em; color:#fff;
    text-shadow:0 3px 16px rgba(0,0,0,.55); }

  .wrap { position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; }

  /* Paint on turf: near-white, pressed down by a shadow underneath
     rather than floating above the grass. */
  .chalk { text-align:center; font-weight:900; letter-spacing:-.04em; line-height:.87;
    font-size:calc(188px * {{SCALE}}); text-transform:uppercase; color:#f2fff4;
    text-shadow:0 7px 0 rgba(0,0,0,.20), 0 14px 34px rgba(0,0,0,.42); }
  .chalk em { font-style:normal; display:block; }

  .sub { margin-top:calc(46px * {{SCALE}}); text-align:center; color:#fff; font-size:calc(44px * {{SCALE}}); font-weight:700;
    text-shadow:0 3px 16px rgba(0,0,0,.6); }
  .sub b { color:#9BFFA6; font-weight:800; }

  .foot { position:absolute; left:0; right:0; bottom:calc(48px * {{SCALE}}); text-align:center;
    color:rgba(255,255,255,.9); font-size:calc(23px * {{SCALE}}); font-weight:500; line-height:1.45;
    text-shadow:0 1px 8px rgba(0,0,0,.7); padding:0 70px; }
</style>

<div class="stage">
  <div class="field">
    <div class="grass"></div>
    <div class="yards"></div>
    <div class="hash a"></div>
    <div class="hash b"></div>
  </div>

  <svg class="grain"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3"/></filter>
    <rect width="100%" height="100%" filter="url(#n)"/></svg>
  <div class="vig"></div>

  <div class="brand"><img src="logo.svg" alt=""><span>Gwuap</span></div>

  <div class="wrap">
    <div class="chalk">{{HEAD}}</div>
    <div class="sub">{{SUB}}</div>
  </div>

  <div class="foot">
    Not a sportsbook. No betting, no money — nothing at stake but your record.
  </div>
</div>
