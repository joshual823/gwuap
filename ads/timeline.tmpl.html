<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:{{W}}px;height:{{H}}px;overflow:hidden;background:#0d2c14}
  .stage{position:relative;width:{{W}}px;height:{{H}}px;overflow:hidden;
    font-family:Inter,'Helvetica Neue',Arial,sans-serif}
  .photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 62%}
  /* Heavier scrim than the other creatives: this one is a list, and a
     list has to be read rather than glanced at. */
  .scrim{position:absolute;inset:0;background:
    linear-gradient(180deg, rgba(4,26,10,.86) 0%, rgba(4,26,10,.78) 45%,
      rgba(4,26,10,.72) 70%, rgba(4,26,10,.88) 100%)}
  .brand{position:absolute;top:calc(58px * {{SCALE}});left:0;right:0;display:flex;
    align-items:center;justify-content:center;gap:calc(15px * {{SCALE}})}
  .brand img{width:calc(52px * {{SCALE}});height:calc(52px * {{SCALE}});
    filter:drop-shadow(0 3px 12px rgba(0,0,0,.6))}
  .brand span{font-size:calc(48px * {{SCALE}});font-weight:800;letter-spacing:-.028em;
    color:#fff;text-shadow:0 3px 16px rgba(0,0,0,.7)}
  .rows{position:absolute;left:0;right:0;top:{{TOP}};padding:0 calc(70px * {{SCALE}})}
  .row{display:flex;align-items:baseline;gap:calc(26px * {{SCALE}});
    padding:calc(13px * {{SCALE}}) 0;border-bottom:1px solid rgba(255,255,255,.14)}
  .yr{font-family:Inter,sans-serif;font-weight:800;font-size:calc(42px * {{SCALE}});
    color:rgba(255,255,255,.62);min-width:calc(116px * {{SCALE}});letter-spacing:-.02em}
  .who{font-weight:700;font-size:calc(42px * {{SCALE}});color:rgba(255,255,255,.82);
    letter-spacing:-.02em}
  .row.us{border-bottom:none;padding-top:calc(20px * {{SCALE}})}
  .row.us .yr{color:#7CFF8C}
  .row.us .who{color:#fff;font-weight:900;font-size:calc(52px * {{SCALE}})}
  .kicker{margin-top:calc(16px * {{SCALE}});font-size:calc(30px * {{SCALE}});
    font-weight:600;color:#DFF6E3;text-shadow:0 2px 12px rgba(0,0,0,.7)}
  .foot{position:absolute;left:0;right:0;bottom:calc(40px * {{SCALE}});text-align:center;
    color:rgba(255,255,255,.9);font-size:calc(21px * {{SCALE}});font-weight:500;
    text-shadow:0 1px 8px rgba(0,0,0,.8);padding:0 60px}
</style>
<div class="stage">
  <img class="photo" src="field.jpg" alt="">
  <div class="scrim"></div>
  <div class="brand"><img src="logo.svg" alt=""><span>Gwuap</span></div>
  <div class="rows">
    {{ROWS}}
    <div class="row us"><span class="yr">2026</span><span class="who">Gwuap</span></div>
    <div class="kicker">{{KICKER}}</div>
  </div>
  <div class="foot">Not a sportsbook. No betting, no money — nothing at stake but your record.</div>
</div>
